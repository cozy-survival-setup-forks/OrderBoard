# OrderBoard. Players post what they want to buy, the money is held until someone delivers, then it goes to them.

# Written in front of prices.
currency: "$"

# Percent added to what a player pays when they post a request. It is not paid back when they cancel.
tax-percent: 0

# Limits for one request.
min-price: 0.01
max-price: 1000000
max-amount: 100000

# Requests a player can have open. Give more with the permission orderboard.max.<number>, for example orderboard.max.10.
default-max-orders: 5

# Days until an open request ends by itself and its money goes back. 0 means never.
expire-days: 14

# Items nobody can ask for.
blacklist:
  - BEDROCK
  - BARRIER
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - LIGHT
  - DEBUG_STICK
  - KNOWLEDGE_BOOK
  - SPAWNER
  - TRIAL_SPAWNER
  - VAULT
  - REINFORCED_DEEPSLATE
  - PETRIFIED_OAK_SLAB
