name: Wanted
version: '${version}'
main: dev.wanted.WantedPlugin
api-version: '1.21'
authors: [Groovyy Roy]
description: Players post what they want to buy and others deliver it for the money
depend:
  - Vault

commands:
  wanted:
    description: Open the market, post a request, collect what was delivered
    aliases: [orders, order]
    usage: /<command> [search | new | mine | collect]

permissions:
  wanted.use:
    description: Use the market
    default: true
  wanted.admin:
    description: Remove anyone's request and reload
    default: op
  wanted.max.*:
    description: Placeholder for wanted.max.<number>, the number of requests a player can have open at once
    default: false
