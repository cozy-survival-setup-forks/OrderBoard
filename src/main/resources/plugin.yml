name: OrderBoard
version: '${version}'
main: dev.orderboard.OrderBoardPlugin
api-version: '1.21'
authors: [Groovyy Roy]
description: Players post what they want to buy and others deliver it for the money
depend:
  - Vault

commands:
  orderboard:
    description: Open the market, post a request, collect what was delivered
    aliases: [orders, order]
    usage: /<command> [search | new | mine | collect]

permissions:
  orderboard.use:
    description: Use the market
    default: true
  orderboard.admin:
    description: Remove anyone's request and reload
    default: op
  orderboard.max.*:
    description: Placeholder for orderboard.max.<number>, the number of requests a player can have open at once
    default: false
